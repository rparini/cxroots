name: Format code

on:
  push:
    branches:
        - "renovate/static-analysis-dependencies"
        - autoformat

env:
    latest_python: 3.12

jobs:
  run-ruff-format:
    permissions:
        contents: write
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        - name: Setup Python ${{ env.latest_python }}
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
          with:
            python-version: ${{ env.latest_python }}
        - name: Install uv
          uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
          with:
            version: "0.11.19"
        - name: Install ruff
          run: uv sync --locked --only-group lint
        - name: Fix
          run: uv run ruff check --fix
        - name: Format
          run: uv run ruff format
        - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
          with:
            commit_message: Autoupdate formtatting with ruff
  