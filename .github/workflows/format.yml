name: Format code

on:
  push:
    branches:
        - "renovate/static-analysis-dependencies"
        - autoformat

env:
    latest_python: 3.14

jobs:
  run-ruff-format:
    permissions:
        contents: write
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        - name: Setup Python ${{ env.latest_python }}
          uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
          with:
            python-version: ${{ env.latest_python }}
        - name: Install uv
          uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
          with:
            version: "0.13.5"
        - name: Install ruff
          run: uv sync --locked --only-group lint
        - name: Fix
          run: uv run ruff check --fix
        - name: Format
          run: uv run ruff format
        - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
          with:
            commit_message: Autoupdate formtatting with ruff
  