name: publish

on:
  release:
    types: [created]

env:
    latest_python: 3.14

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ env.latest_python }}
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.11.19"
    - name: Build docs
      uses: ./.github/actions/build-docs
      env:
        SPHINX_GITHUB_CHANGELOG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build wheel
      run: uv build
    - name: Publish
      run: uv publish
    - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
      with:
        commit_message: Autoupdate documentation
        file_pattern: docs/*
        branch: master

  test:
    needs: deploy
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: 
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Get tag name
      id: get_tag_name
      run: |
        echo "GITHUB_REF: $GITHUB_REF"
        echo "VERSION: ${GITHUB_REF/refs\/tags\/v/}"
        echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\/v/}
    - name: Install cxroots from pip
      run: |
        VERSION=${{ steps.get_tag_name.outputs.VERSION }}
        pip install cxroots==$VERSION --uploaded-prior-to P3D
    - name: Test import cxroots
      run: python -c "import cxroots; print(cxroots.__version__)"
